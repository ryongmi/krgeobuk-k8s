# =============================================================================
# Ingress 사용 가이드 (Production)
# =============================================================================
#
# 📋 도메인 구조:
# ---------------
# 예시 도메인: krgeobuk.com (실제 배포 시 도메인 변경 필요)
#
# 클라이언트 (서브도메인):
#   - portal.krgeobuk.com       → portal-client (Next.js)
#   - portal-admin.krgeobuk.com → portal-admin-client (Next.js)
#   - mypick.krgeobuk.com       → mypick-client (Next.js)
#   - mypick-admin.krgeobuk.com → mypick-admin-client (Next.js)
#
# API (api 서브도메인 + 경로):
#   - api.krgeobuk.com/auth/*   → auth-server (NestJS)
#   - api.krgeobuk.com/authz/*  → authz-server (NestJS)
#   - api.krgeobuk.com/portal/* → portal-server (NestJS)
#   - api.krgeobuk.com/mypick/* → mypick-server (NestJS)
#
# 📝 API 호출 예시:
# -----------------
# // portal-client에서 API 호출
# const response = await fetch('https://api.krgeobuk.com/auth/login', {
#   method: 'POST',
#   credentials: 'include',
#   headers: { 'Content-Type': 'application/json' },
#   body: JSON.stringify({ username, password })
# });
#
# // Next.js 자체 API (헬스체크)
# // pages/api/health.ts → https://portal.krgeobuk.com/api/health
# export default function handler(req, res) {
#   res.status(200).json({ status: 'ok' })
# }
#
# 🔒 HTTPS/TLS 자동 설정 (cert-manager):
# --------------------------------------
# 1. cert-manager 설치 (클러스터에 한 번만):
#    kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml
#
# 2. Let's Encrypt ClusterIssuer 생성:
#
#    apiVersion: cert-manager.io/v1
#    kind: ClusterIssuer
#    metadata:
#      name: letsencrypt-prod
#    spec:
#      acme:
#        server: https://acme-v02.api.letsencrypt.org/directory
#        email: your-email@example.com  # 실제 이메일로 변경 필요
#        privateKeySecretRef:
#          name: letsencrypt-prod
#        solvers:
#        - http01:
#            ingress:
#              class: nginx
#
# 3. Ingress 배포 시 자동으로 SSL 인증서 발급됨
#
# 📌 배포 전 필수 설정:
# ---------------------
# 1. 도메인 변경:
#    - 모든 *.krgeobuk.com을 실제 도메인으로 변경
#    - CORS 설정의 origin도 함께 변경
#
# 2. DNS 설정:
#    - Ingress Controller의 External IP 확인:
#      kubectl get svc -n ingress-nginx ingress-nginx-controller
#
#    - DNS A 레코드 추가:
#      api.krgeobuk.com         → <EXTERNAL-IP>
#      portal.krgeobuk.com      → <EXTERNAL-IP>
#      portal-admin.krgeobuk.com → <EXTERNAL-IP>
#      mypick.krgeobuk.com      → <EXTERNAL-IP>
#      mypick-admin.krgeobuk.com → <EXTERNAL-IP>
#
# 3. cert-manager ClusterIssuer 이메일 설정:
#    - letsencrypt-prod의 email을 실제 관리자 이메일로 변경
#
# 📦 배포:
# --------
# kubectl apply -f environments/prod/ingress.yaml
#
# 🔍 확인:
# --------
# # Ingress 목록
# kubectl get ingress -n krgeobuk-prod
#
# # TLS 인증서 확인
# kubectl get certificate -n krgeobuk-prod
#
# # 인증서 상세 정보
# kubectl describe certificate api-krgeobuk-tls -n krgeobuk-prod
#
# # 인증서 발급 과정 확인
# kubectl get certificaterequest -n krgeobuk-prod
#
# 🐛 트러블슈팅:
# --------------
# # Ingress Controller 로그
# kubectl logs -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx
#
# # cert-manager 로그
# kubectl logs -n cert-manager -l app=cert-manager
#
# # 특정 Ingress 이벤트
# kubectl get events -n krgeobuk-prod --sort-by='.lastTimestamp'
#
# # 인증서 발급 실패 시
# kubectl describe challenge -n krgeobuk-prod
#
# 🔐 보안 설정:
# -------------
# - SSL/TLS: Let's Encrypt 자동 인증서
# - HSTS: 31536000초 (1년), 서브도메인 포함
# - Force HTTPS: 모든 HTTP 요청을 HTTPS로 리다이렉트
# - CORS: 특정 서브도메인만 허용 (credentials 포함)
# - Rate Limiting: 필요 시 주석 해제하여 사용
#
# 💡 팁:
# ------
# - 프로덕션 배포 전 staging 환경에서 테스트 권장
# - letsencrypt-staging으로 먼저 테스트 후 letsencrypt-prod 사용
# - DNS 전파는 최대 48시간 소요될 수 있음 (보통 몇 분 ~ 몇 시간)
# - Let's Encrypt는 도메인당 주간 발급 제한이 있으므로 주의
