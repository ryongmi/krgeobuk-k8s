# Production Environment Ingress
# API 서브도메인 패턴 사용 (api.krgeobuk.com)
# 클라이언트는 서브도메인으로 분리
# TLS/HTTPS 필수

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krgeobuk-api-ingress
  namespace: krgeobuk-prod
  annotations:
    # NGINX Ingress Controller 설정
    # 서버가 서비스별 프리픽스를 사용하므로 rewrite 불필요

    # CORS 설정 (프로덕션 - 클라이언트 서브도메인 허용)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://portal.krgeobuk.com, https://portal-admin.krgeobuk.com, https://mypick.krgeobuk.com, https://mypick-admin.krgeobuk.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # 타임아웃 설정
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # 요청 크기 제한
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # SSL 리다이렉트 활성화 (Prod 환경 필수)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # HSTS 설정 (보안 강화)
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"

    # Rate Limiting (선택사항)
    # nginx.ingress.kubernetes.io/limit-rps: "100"

    # cert-manager 설정 (자동 SSL 인증서 발급)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

spec:
  ingressClassName: nginx

  # TLS 설정 (Let's Encrypt 자동 인증서)
  tls:
  - hosts:
    - api.krgeobuk.com
    secretName: api-krgeobuk-tls

  rules:
  # =============================================================================
  # API 서브도메인: api.krgeobuk.com
  # 모든 백엔드 API 서비스를 경로로 구분
  # =============================================================================
  - host: api.krgeobuk.com
    http:
      paths:
      # auth-server: /auth/*
      # 예: api.krgeobuk.com/auth/auth/login → auth-server:80/auth/auth/login
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-server
            port:
              number: 80

      # authz-server: /authz/*
      # 예: api.krgeobuk.com/authz/authz/permissions → authz-server:80/authz/authz/permissions
      - path: /authz
        pathType: Prefix
        backend:
          service:
            name: authz-server
            port:
              number: 80

      # portal-server: /portal/*
      # 예: api.krgeobuk.com/portal/portal/users → portal-server:80/portal/portal/users
      - path: /portal
        pathType: Prefix
        backend:
          service:
            name: portal-server
            port:
              number: 80

      # mypick-server: /mypick/*
      # 예: api.krgeobuk.com/mypick/mypick/items → mypick-server:80/mypick/mypick/items
      - path: /mypick
        pathType: Prefix
        backend:
          service:
            name: mypick-server
            port:
              number: 80

---
# =============================================================================
# 클라이언트용 Ingress (개별 서브도메인)
# =============================================================================
