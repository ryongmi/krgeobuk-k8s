---
# =============================================================================
# Ingress 사용 가이드
# =============================================================================
#
# 📋 도메인 구조 (nip.io 사용):
# ---------------
# miniPC IP: 192.168.0.28
# nip.io: 무료 wildcard DNS 서비스 (IP를 도메인처럼 사용)
#
# 클라이언트 (서브도메인):
#   - portal.192.168.0.28.nip.io       → portal-client (Next.js)
#   - portal-admin.192.168.0.28.nip.io → portal-admin-client (Next.js)
#   - mypick.192.168.0.28.nip.io       → mypick-client (Next.js)
#   - mypick-admin.192.168.0.28.nip.io → mypick-admin-client (Next.js)
#
# API (api 서브도메인 + 경로):
#   - api.192.168.0.28.nip.io/auth/*   → auth-server (NestJS)
#   - api.192.168.0.28.nip.io/authz/*  → authz-server (NestJS)
#   - api.192.168.0.28.nip.io/portal/* → portal-server (NestJS)
#   - api.192.168.0.28.nip.io/mypick/* → mypick-server (NestJS)
#
# 📝 API 호출 예시:
# -----------------
# // portal-client에서 API 호출
# const response = await fetch('http://api.192.168.0.28.nip.io/auth/login', {
#   method: 'POST',
#   credentials: 'include',
#   headers: { 'Content-Type': 'application/json' },
#   body: JSON.stringify({ username, password })
# });
#
# // Next.js 자체 API (헬스체크)
# // pages/api/health.ts → http://portal.192.168.0.28.nip.io/api/health
# export default function handler(req, res) {
#   res.status(200).json({ status: 'ok' })
# }
#
# 🔒 HTTPS/TLS 설정:
# ------------------
# 1. cert-manager 설치:
#    kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml
#
# 2. ClusterIssuer 생성:
#    apiVersion: cert-manager.io/v1
#    kind: ClusterIssuer
#    metadata:
#      name: letsencrypt-staging
#    spec:
#      acme:
#        server: https://acme-staging-v02.api.letsencrypt.org/directory
#        email: your-email@example.com
#        privateKeySecretRef:
#          name: letsencrypt-staging
#        solvers:
#        - http01:
#            ingress:
#              class: nginx
#
# 3. Ingress의 tls 섹션과 cert-manager annotation 주석 해제
#
# 🌐 nip.io 사용 (DNS 설정 불필요):
# ------------
# nip.io는 자동으로 DNS를 해석해주므로 별도 설정이 필요 없습니다!
#
# 작동 방식:
#   portal.192.168.0.28.nip.io → 자동으로 192.168.0.28로 해석
#   api.192.168.0.28.nip.io    → 자동으로 192.168.0.28로 해석
#
# 즉시 사용 가능:
#   http://portal.192.168.0.28.nip.io
#   http://api.192.168.0.28.nip.io/auth/login
#
# 같은 네트워크의 모든 기기에서 접근 가능:
#   - 스마트폰
#   - 다른 PC
#   - 태블릿
#
# 🔄 나중에 실제 도메인으로 전환:
# ----------------------------
# 도메인 구입 후 host만 변경하면 됩니다:
#   api.192.168.0.28.nip.io → api.dev.krgeobuk.com
#   portal.192.168.0.28.nip.io → portal.dev.krgeobuk.com
#
# 📦 배포:
# --------
# kubectl apply -f environments/dev/ingress.yaml
#
# 🔍 확인:
# --------
# kubectl get ingress -n krgeobuk-dev
# kubectl describe ingress krgeobuk-api-ingress -n krgeobuk-dev
#
# 🐛 트러블슈팅:
# --------------
# # Ingress Controller 로그
# kubectl logs -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx
#
# # 특정 Ingress 이벤트
# kubectl get events -n krgeobuk-dev --sort-by='.lastTimestamp'
