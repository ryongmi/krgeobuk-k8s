apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: krgeobuk-prod

resources:
  - ../../base

patches:
  - path: patch-deployment.yaml

configMapGenerator:
  - name: authz-server-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - MYSQL_DATABASE=authz_prod
      - CORS_ORIGINS=https://auth.krgeobuk.com,https://portal.krgeobuk.com,https://portal-admin.krgeobuk.com,https://mypick.krgeobuk.com,https://mypick-admin.krgeobuk.com
      - LOG_LEVEL=info
      - REDIS_KEY_PREFIX=prod

commonLabels:
  environment: production
