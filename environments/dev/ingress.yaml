# Development Environment Ingress
# API 서브도메인 패턴 사용 (api.dev.krgeobuk.com)
# 클라이언트는 서브도메인으로 분리

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krgeobuk-api-ingress
  namespace: krgeobuk-dev
  annotations:
    # NGINX Ingress Controller 설정
    # 서버가 서비스별 프리픽스를 사용하므로 rewrite 불필요

    # CORS 설정 (클라이언트 서브도메인 허용)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://portal.192.168.0.28.nip.io, http://portal-admin.192.168.0.28.nip.io, http://mypick.192.168.0.28.nip.io, http://mypick-admin.192.168.0.28.nip.io"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # 타임아웃 설정
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # 요청 크기 제한
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # SSL 리다이렉트 (Dev 환경은 선택적)
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

    # cert-manager 설정 (도메인 인증서 자동 발급)
    # cert-manager.io/cluster-issuer: "letsencrypt-staging"

spec:
  ingressClassName: nginx

  # TLS 설정 (HTTPS 사용 시 활성화)
  # tls:
  # - hosts:
  #   - api.192.168.0.28.nip.io
  #   secretName: api-dev-krgeobuk-tls

  rules:
  # =============================================================================
  # API 서브도메인: api.192.168.0.28.nip.io
  # 모든 백엔드 API 서비스를 경로로 구분
  # =============================================================================
  - host: api.192.168.0.28.nip.io
    http:
      paths:
      # auth-server: /auth/*
      # 예: api.192.168.0.28.nip.io/auth/login → auth-server:80/auth/login
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-server
            port:
              number: 80

      # authz-server: /authz/*
      # 예: api.192.168.0.28.nip.io/authz/permissions → authz-server:80/authz/permissions
      - path: /authz
        pathType: Prefix
        backend:
          service:
            name: authz-server
            port:
              number: 80

      # portal-server: /portal/*
      # 예: api.192.168.0.28.nip.io/portal/users → portal-server:80/portal/users
      - path: /portal
        pathType: Prefix
        backend:
          service:
            name: portal-server
            port:
              number: 80

      # mypick-server: /mypick/*
      # 예: api.192.168.0.28.nip.io/mypick/items → mypick-server:80/mypick/items
      - path: /mypick
        pathType: Prefix
        backend:
          service:
            name: mypick-server
            port:
              number: 80

---
# =============================================================================
# 클라이언트용 Ingress (개별 서브도메인)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krgeobuk-portal-client-ingress
  namespace: krgeobuk-dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # cert-manager.io/cluster-issuer: "letsencrypt-staging"

spec:
  ingressClassName: nginx

  # TLS 설정
  # tls:
  # - hosts:
  #   - portal.192.168.0.28.nip.io
  #   secretName: portal-client-dev-tls

  rules:
  - host: portal.192.168.0.28.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portal-client
            port:
              number: 80

