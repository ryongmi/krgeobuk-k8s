apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: krgeobuk-prod

resources:
- ../../base

patches:
- path: patch-deployment.yaml

configMapGenerator:
- name: portal-admin-client-config
  behavior: merge
  literals:
  - NODE_ENV=production
  - NEXT_PUBLIC_ENVIRONMENT=production
  - NEXT_PUBLIC_AUTH_SERVER_URL=https://api.krgeobuk.com/auth
  - NEXT_PUBLIC_AUTHZ_SERVER_URL=https://api.krgeobuk.com/authz
  - NEXT_PUBLIC_PORTAL_SERVER_URL=https://api.krgeobuk.com/portal
  - NEXT_PUBLIC_TOKEN_REFRESH_URL=https://api.krgeobuk.com/auth/auth/refresh
  - NEXT_PUBLIC_ADMIN_CLIENT_URL=https://portal-admin.krgeobuk.com
  - NEXT_PUBLIC_PORTAL_CLIENT_URL=https://portal.krgeobuk.com
  - ALLOWED_ORIGINS=krgeobuk.com,auth.krgeobuk.com,portal.krgeobuk.com,portal-admin.krgeobuk.com,api.krgeobuk.com
  - NEXT_PUBLIC_DEBUG=false
  - NEXT_PUBLIC_LOG_LEVEL=error

commonLabels:
  environment: production
